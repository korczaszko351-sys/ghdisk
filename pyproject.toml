[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghdisk"
version = "1.0.0"
description = "Wirtualny dysk 1024 PB zamontowany na repozytorium GitHub (FUSE, chunking, dedup, zstd)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ghdisk contributors" }]
keywords = ["fuse", "github", "virtual-filesystem", "deduplication", "zstd", "storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "requests>=2.31",
    "zstandard>=0.22",
]

[project.optional-dependencies]
fuse = ["fusepy>=3.0.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ghdisk = "ghdisk.cli:main"

[project.urls]
Homepage = "https://github.com/"
Documentation = "https://github.com/"

[tool.setuptools.packages.find]
include = ["ghdisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
